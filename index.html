<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Northcroft QS Team</title>
    <meta name="description" content="Northcroft QS Team: the team's projects, tasks, announcements and attendance." />
    <meta name="theme-color" content="#060607" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QS Team" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/brand/northcroft-qs-team-logo-900.webp" as="image" type="image/webp" />
    <link rel="icon" href="/icons/favicon-32.png?v=onyx" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=onyx" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      .boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(62% 62% at 96% 0%,rgba(253,0,2,.14),transparent 70%),radial-gradient(120% 120% at 50% 35%,transparent 55%,#000 100%),radial-gradient(90% 60% at 50% -15%,#1b1b1e 0%,transparent 62%),#060607;color:#f7f7f6}
      .boot-logo{display:block;line-height:0}.boot-logo img,.boot>.boot-inner>img{display:block;width:min(360px,84vw);height:auto}
      .boot-inner{display:flex;flex-direction:column;align-items:center;gap:22px;animation:boot-in .5s cubic-bezier(.2,.8,.2,1) both}
      .boot-bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
      .boot-bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:inherit;background:rgba(255,255,255,.85);animation:boot-bar 1.1s ease-in-out infinite}
      @keyframes boot-in{from{opacity:0;transform:scale(.96)}}
      @keyframes boot-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){.boot-inner,.boot-bar::after{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Opening Northcroft QS Team"><div class="boot-inner"><img src="/brand/northcroft-qs-team-logo-900.webp" width="360" height="180" alt="" /><span class="boot-bar"></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
