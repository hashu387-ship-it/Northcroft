<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Northcroft QS Team</title>
    <meta name="description" content="Northcroft QS Team: the team's projects, tasks, announcements and attendance." />
    <meta name="theme-color" content="#0b1d46" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QS Team" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/brand/qs-team-badge-512.webp" as="image" type="image/webp" />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=badge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      .boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(120% 80% at 80% 0%,rgba(241,62,68,.28),transparent 55%),radial-gradient(120% 90% at 0% 100%,rgba(10,132,255,.35),transparent 60%),#012061;color:#fff}
      .boot-inner{display:flex;flex-direction:column;align-items:center;gap:22px;animation:boot-in .5s cubic-bezier(.2,.8,.2,1) both}
      .boot-bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
      .boot-bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:inherit;background:rgba(255,255,255,.85);animation:boot-bar 1.1s ease-in-out infinite}
      @keyframes boot-in{from{opacity:0;transform:scale(.96)}}
      @keyframes boot-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){.boot-inner,.boot-bar::after{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Opening Northcroft QS Team"><div class="boot-inner"><img src="/brand/qs-team-badge-512.webp" width="168" height="168" alt="" style="display:block;border-radius:50%;box-shadow:0 18px 44px rgba(0,0,0,.35)" /><span class="boot-bar"></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
