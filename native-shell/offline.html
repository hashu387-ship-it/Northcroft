<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Northcroft</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: radial-gradient(90% 60% at 50% -15%, #1b3566 0%, transparent 62%), #0b1a33;
        color: #fff; font: 16px/1.5 -apple-system, system-ui, sans-serif; text-align: center;
      }
      main { max-width: 320px; }
      h1 { font-size: 21px; margin: 18px 0 6px; }
      p { color: #c8d3e6; margin: 0 0 22px; }
      button {
        font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 14px; padding: 13px 26px;
        background: linear-gradient(180deg, #f35a5f, #e02b33); box-shadow: 0 8px 22px rgba(224, 43, 51, 0.35);
      }
      .dot { width: 64px; height: 64px; margin: 0 auto; border-radius: 20px; display: grid; place-items: center; background: rgba(255,255,255,.08); }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
      </div>
      <h1>No connection</h1>
      <p>Northcroft needs the internet the first time it opens. Check your Wi-Fi or mobile data and try again.</p>
      <button type="button" onclick="location.href='https://northcroft-qs-team.vercel.app/'">Try again</button>
    </main>
  </body>
</html>
